; PlatformIO Project Configuration File for EW Gesture VLC Music Player
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting

[platformio]
default_envs = receiver_player

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:transmitter_glove]
build_src_filter = +<../firmware/transmitter_glove/*>
lib_deps =
    Wire

[env:receiver_player]
build_src_filter = +<../firmware/receiver_player/*>
lib_deps =
